let results=[];
const tb=document.querySelector('#tb tbody');
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function geo(q){
  const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q);
  try{const r=await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
      if(!r.ok)return null;const j=await r.json();
      if(j&&j.length)return{lat:parseFloat(j[0].lat),lon:parseFloat(j[0].lon)};return null;
  }catch(e){return 'erro';}
}
async function run(){
  document.getElementById('go').disabled=true;
  results=[];tb.innerHTML='';
  for(let i=0;i<DATA.length;i++){
    const d=DATA[i];
    document.getElementById('prog').textContent='Geocodificando '+(i+1)+' de '+DATA.length+': '+d.Unidade;
    let prec='exata',hit=await geo(d.Endereco);
    if(hit===null||hit==='erro'){await sleep(1100);
       const h2=await geo(d.Municipio+', RJ, Brasil');
       if(h2&&h2!=='erro'){hit=h2;prec='aproximada (cidade)';}else{hit=null;}}
    const row={...d,lat:hit?hit.lat:'',lon:hit?hit.lon:'',precisao:hit?prec:'NAO ENCONTRADO'};
    results.push(row);
    const tr=document.createElement('tr');
    const cls=!hit?'fail':(prec==='exata'?'ok':'aprox');
    const stat=!hit?'❌ não achou':(prec==='exata'?'✅ exata':'⚠ cidade');
    tr.innerHTML='<td>'+(i+1)+'</td><td>'+d.Unidade+'</td><td class="'+cls+'">'+stat+'</td><td>'+(hit?hit.lat.toFixed(6):'')+'</td><td>'+(hit?hit.lon.toFixed(6):'')+'</td>';
    tb.appendChild(tr);
    document.getElementById('barf').style.width=((i+1)/DATA.length*100)+'%';
    await sleep(1100);
  }
  const okc=results.filter(r=>r.precisao==='exata').length;
  const apc=results.filter(r=>r.precisao.startsWith('aprox')).length;
  const nf=results.filter(r=>r.precisao==='NAO ENCONTRADO').length;
  document.getElementById('prog').textContent='Concluído! '+okc+' exatas, '+apc+' aproximadas (cidade), '+nf+' não encontradas. Clica em Baixar CSV.';
  document.getElementById('dl').disabled=false;
}
function dl(){
  const cols=['Unidade','Endereco','Municipio','Bloco','Categoria','Tipo','lat','lon','precisao'];
  let csv='\ufeff'+cols.join(',')+'\n';
  for(const r of results){csv+=cols.map(c=>'"'+String(r[c]).replace(/"/g,'""')+'"').join(',')+'\n';}
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='coordenadas_51.csv';a.click();
}
